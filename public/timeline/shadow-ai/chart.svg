<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"><title>AI in breaches, 2025</title><rect width="1200" height="675" fill="#F3F4F0"/><rect width="1200" height="16" fill="#0B6B63"/><text x="60" y="80" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="36" font-weight="700" fill="#10141A" text-anchor="start">AI in breaches, 2025</text><text x="60" y="162" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">AI model/app breached</text><rect x="440" y="130" width="720" height="50" rx="10" fill="#E6E9E2" stroke="#10141A" stroke-width="4"/><rect x="440" y="130" width="91" height="50" rx="10" fill="#0B6B63" stroke="#10141A" stroke-width="4"/><text x="551" y="164" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#10141A" text-anchor="start">13%</text><text x="60" y="272" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">..of those, weak AI access</text><rect x="440" y="240" width="720" height="50" rx="10" fill="#E6E9E2" stroke="#10141A" stroke-width="4"/><rect x="440" y="240" width="679" height="50" rx="10" fill="#F2B66B" stroke="#10141A" stroke-width="4"/><text x="1029" y="274" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#10141A" text-anchor="start">97%</text><text x="60" y="382" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">Breached, no AI policy</text><rect x="440" y="350" width="720" height="50" rx="10" fill="#E6E9E2" stroke="#10141A" stroke-width="4"/><rect x="440" y="350" width="441" height="50" rx="10" fill="#0B6B63" stroke="#10141A" stroke-width="4"/><text x="901" y="384" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#10141A" text-anchor="start">63%</text><text x="60" y="492" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">Breach via shadow AI</text><rect x="440" y="460" width="720" height="50" rx="10" fill="#E6E9E2" stroke="#10141A" stroke-width="4"/><rect x="440" y="460" width="140" height="50" rx="10" fill="#F2B66B" stroke="#10141A" stroke-width="4"/><text x="600" y="494" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#10141A" text-anchor="start">20%</text><text x="60" y="640" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="400" fill="#10141A" text-anchor="start">Source: IBM, Cost of a Data Breach Report 2025 (press release, 30 July 2025)</text></svg>
