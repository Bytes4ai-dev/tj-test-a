<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"><title>A governed, evidence-backed change loop</title><rect width="1200" height="675" fill="#F3F4F0"/><rect width="1200" height="16" fill="#0B6B63"/><text x="60" y="80" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="36" font-weight="700" fill="#10141A" text-anchor="start">A governed, evidence-backed change loop</text><line x1="300" y1="200" x2="800" y2="200" stroke="#0B6B63" stroke-width="8"/><line x1="800" y1="200" x2="800" y2="470" stroke="#0B6B63" stroke-width="8"/><line x1="800" y1="470" x2="300" y2="470" stroke="#0B6B63" stroke-width="8"/><line x1="300" y1="470" x2="300" y2="200" stroke="#0B6B63" stroke-width="8"/><rect x="170" y="145" width="260" height="110" rx="16" fill="#E6E9E2" stroke="#10141A" stroke-width="6"/><text x="300" y="192" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="26" font-weight="700" fill="#10141A" text-anchor="middle">Propose</text><text x="300" y="226" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">agent drafts a change</text><rect x="670" y="145" width="260" height="110" rx="16" fill="#E6E9E2" stroke="#10141A" stroke-width="6"/><text x="800" y="192" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="26" font-weight="700" fill="#10141A" text-anchor="middle">Review</text><text x="800" y="226" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">separate check</text><rect x="670" y="415" width="260" height="110" rx="16" fill="#E6E9E2" stroke="#10141A" stroke-width="6"/><text x="800" y="462" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="26" font-weight="700" fill="#10141A" text-anchor="middle">Approve</text><text x="800" y="496" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">gate, human if needed</text><rect x="170" y="415" width="260" height="110" rx="16" fill="#E6E9E2" stroke="#10141A" stroke-width="6"/><text x="300" y="462" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="26" font-weight="700" fill="#10141A" text-anchor="middle">Ship + record</text><text x="300" y="496" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">evidence kept</text><rect x="980" y="300" width="180" height="80" rx="16" fill="#F2B66B" stroke="#10141A" stroke-width="6"/><text x="1070" y="348" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#10141A" text-anchor="middle">Tested stop</text><text x="550" y="345" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">Govern · Map · Measure · Manage</text><text x="60" y="640" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="400" fill="#10141A" text-anchor="start">Source: Bytes4AI diagram; functions from the NIST AI Risk Management Framework 1.0</text></svg>
