<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"><title>EU AI Act: when the rules apply</title><rect width="1200" height="675" fill="#F3F4F0"/><rect width="1200" height="16" fill="#0B6B63"/><text x="60" y="80" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="36" font-weight="700" fill="#10141A" text-anchor="start">EU AI Act: when the rules apply</text><rect x="80" y="330" width="1040" height="10" fill="#10141A"/><circle cx="80" cy="335" r="22" fill="#F2B66B" stroke="#10141A" stroke-width="6"/><text x="80" y="270" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#10141A" text-anchor="middle">1 Aug 2024</text><text x="80" y="300" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">Enters into force</text><circle cx="340" cy="335" r="22" fill="#0B6B63" stroke="#10141A" stroke-width="6"/><text x="340" y="410" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#10141A" text-anchor="middle">2 Feb 2025</text><text x="340" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">Prohibitions,</text><text x="340" y="466" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">AI literacy</text><circle cx="600" cy="335" r="22" fill="#0B6B63" stroke="#10141A" stroke-width="6"/><text x="600" y="270" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#10141A" text-anchor="middle">2 Aug 2025</text><text x="600" y="300" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">General-purpose</text><text x="600" y="326" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">AI model rules</text><circle cx="860" cy="335" r="22" fill="#0B6B63" stroke="#10141A" stroke-width="6"/><text x="860" y="410" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#10141A" text-anchor="middle">2 Aug 2026</text><text x="860" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">Most remaining</text><text x="860" y="466" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">rules</text><circle cx="1120" cy="335" r="22" fill="#0B6B63" stroke="#10141A" stroke-width="6"/><text x="1120" y="270" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#10141A" text-anchor="middle">2 Aug 2027</text><text x="1120" y="300" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">Earlier GPAI</text><text x="1120" y="326" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#10141A" text-anchor="middle">models comply</text><text x="60" y="640" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="400" fill="#10141A" text-anchor="start">Source: artificialintelligenceact.eu implementation timeline; Regulation (EU) 2024/1689</text></svg>
