<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"><title>Why agent projects get canceled</title><rect width="1200" height="675" fill="#F3F4F0"/><rect width="1200" height="16" fill="#0B6B63"/><text x="60" y="80" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="36" font-weight="700" fill="#10141A" text-anchor="start">Why agent projects get canceled</text><rect x="68" y="248" width="247" height="170" rx="16" fill="#10141A"/><rect x="60" y="240" width="247" height="170" rx="16" fill="#E6E9E2" stroke="#10141A" stroke-width="6"/><text x="183" y="300" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">Announce</text><text x="183" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="middle">an agent</text><polygon points="313,315 333,325 313,335" fill="#10141A"/><rect x="345" y="248" width="247" height="170" rx="16" fill="#10141A"/><rect x="337" y="240" width="247" height="170" rx="16" fill="#E6E9E2" stroke="#10141A" stroke-width="6"/><text x="460" y="300" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">Pilot</text><polygon points="590,315 610,325 590,335" fill="#10141A"/><rect x="622" y="248" width="247" height="170" rx="16" fill="#10141A"/><rect x="614" y="240" width="247" height="170" rx="16" fill="#F2B66B" stroke="#10141A" stroke-width="6"/><text x="737" y="300" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">Checkpoint:</text><text x="737" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="middle">cost, value,</text><text x="737" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="middle">risk controls</text><polygon points="867,315 887,325 867,335" fill="#10141A"/><rect x="899" y="248" width="247" height="170" rx="16" fill="#10141A"/><rect x="891" y="240" width="247" height="170" rx="16" fill="#E6E9E2" stroke="#10141A" stroke-width="6"/><text x="1014" y="300" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">Scale</text><text x="1014" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="middle">or cancel</text><text x="600" y="500" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="400" fill="#10141A" text-anchor="middle">Gartner predicts over 40% of agentic AI projects canceled by end of 2027</text><text x="60" y="640" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="400" fill="#10141A" text-anchor="start">Source: Gartner press release, 25 June 2025</text></svg>
