<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"><title>AI tools and task time: felt vs measured</title><rect width="1200" height="675" fill="#F3F4F0"/><rect width="1200" height="16" fill="#0B6B63"/><text x="60" y="80" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="36" font-weight="700" fill="#10141A" text-anchor="start">AI tools and task time: felt vs measured</text><text x="60" y="162" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">Expected speed-up</text><rect x="440" y="130" width="720" height="50" rx="10" fill="#E6E9E2" stroke="#10141A" stroke-width="4"/><rect x="440" y="130" width="560" height="50" rx="10" fill="#0B6B63" stroke="#10141A" stroke-width="4"/><text x="910" y="164" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#10141A" text-anchor="start">24%</text><text x="60" y="272" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">Believed speed-up</text><rect x="440" y="240" width="720" height="50" rx="10" fill="#E6E9E2" stroke="#10141A" stroke-width="4"/><rect x="440" y="240" width="466" height="50" rx="10" fill="#0B6B63" stroke="#10141A" stroke-width="4"/><text x="926" y="274" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#10141A" text-anchor="start">20%</text><text x="60" y="382" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">Measured: slower by</text><rect x="440" y="350" width="720" height="50" rx="10" fill="#E6E9E2" stroke="#10141A" stroke-width="4"/><rect x="440" y="350" width="443" height="50" rx="10" fill="#F2B66B" stroke="#10141A" stroke-width="4"/><text x="903" y="384" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#10141A" text-anchor="start">19%</text><text x="60" y="640" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="400" fill="#10141A" text-anchor="start">Source: METR, early-2025 study of 16 experienced open-source developers</text></svg>
