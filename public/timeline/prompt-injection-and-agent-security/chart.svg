<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"><title>The lethal trifecta for AI agents</title><rect width="1200" height="675" fill="#F3F4F0"/><rect width="1200" height="16" fill="#0B6B63"/><text x="60" y="80" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="36" font-weight="700" fill="#10141A" text-anchor="start">The lethal trifecta for AI agents</text><circle cx="390" cy="270" r="140" fill="#7FD6CB" fill-opacity="0.45" stroke="#10141A" stroke-width="6"/><text x="340" y="240" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">Access to</text><text x="340" y="266" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">private data</text><circle cx="630" cy="270" r="140" fill="#7FD6CB" fill-opacity="0.45" stroke="#10141A" stroke-width="6"/><text x="660" y="240" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">Exposure to</text><text x="660" y="266" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">untrusted content</text><circle cx="510" cy="430" r="140" fill="#7FD6CB" fill-opacity="0.45" stroke="#10141A" stroke-width="6"/><text x="510" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">Ability to</text><text x="510" y="516" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#10141A" text-anchor="middle">communicate out</text><circle cx="510" cy="330" r="30" fill="#F2B66B" stroke="#10141A" stroke-width="6"/><text x="840" y="330" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#10141A" text-anchor="start">All three together:</text><text x="840" y="360" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">data can be stolen.</text><text x="840" y="390" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="400" fill="#10141A" text-anchor="start">Remove one leg.</text><text x="60" y="640" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="400" fill="#10141A" text-anchor="start">Source: Simon Willison, The lethal trifecta for AI agents (16 June 2025)</text></svg>
